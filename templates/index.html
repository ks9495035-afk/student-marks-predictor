<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }

        h1 {
            color: #333;
        }

        .result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Marks Predictor</h1>

    <form method="POST">

        <input type="number" step="0.1"
               name="study_hours"
               placeholder="Study Hours"
               required>

        <input type="number" step="0.1"
               name="attendance"
               placeholder="Attendance %"
               required>

        <input type="number" step="0.1"
               name="previous_marks"
               placeholder="Previous Marks"
               required>

        <button type="submit">Predict Marks</button>

    </form>

    {% if prediction is not none %}
        <div class="result">
            Predicted Marks: {{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
